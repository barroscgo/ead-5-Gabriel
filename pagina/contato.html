<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="../styles.css"> 
    <title>Formulário de Contato dos Usuários Cadastrados</title>
</head>
<body>
    <div class="container">
        
        <button id="navegateBtn" onclick="window.location.href='../index.html'">Ir para Cadastro de Usuários</button>

        <h1>Contato</h1>
        <form id="contactForm">
            <label for="name">Nome:</label>
            <input type="text" id="name" name="name" required placeholder="Informe o nome do usuário criado aqui.">

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required placeholder="Informe o email.">

            <label for="message">Mensagem:</label>
            <textarea id="message" name="message" rows="4" required placeholder="Digite sua mensagem aqui..."></textarea>

            <button type="submit">Enviar</button>
        </form>
    </div>

    <script src="../scripts.js"></script>
